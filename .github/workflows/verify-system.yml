name: Kiem tra toan he thong

# LY DO TON TAI
# Toan bo 122 khang dinh trong tests/verify-system.ps1 - ke ca cac chot chong ha rao am tham,
# chot cam ep cung gia, chot bat buoc last-check, chot bang chung flash sale - TRUOC NGAY
# 10-11-2026 khong he duoc chay tu dong o dau ca. Chung chi chay khi co nguoi go lenh bang tay.
#
# Mot cong khong ai chay thi khong phai la cong. Do la dung nguyen nhan goc ma du an van mac:
# quy tac duoc ghi dung, chot duoc viet ra, roi mot commit sau do lang le lam sai va khong co
# gi keu len.
#
# Phan cong kiem tra:
#   - node tests/verify_scan.js   (DU LIEU)  -> chay 8 lan/ngay trong scan-tgdd.yml
#   - tests/verify-system.ps1     (MA + LUAT) -> chay o day: moi thay doi ma, va 1 lan/ngay
#
# Chay tren windows-latest vi suite dung mui gio Windows ('SE Asia Standard Time') va duong
# dan Chrome/Edge kieu Windows cho Nhom 4 (E2E).

on:
  push:
    paths:
      - 'tests/**'
      - 'scraper/**'
      - '.github/workflows/**'
      - 'CONSTRAINTS.md'
      - 'index.html'
      - 'promotion tgdd.html'
      - 'promotion tgdd standalone.html'
      - 'data/data.js'
  pull_request:
    paths:
      - 'tests/**'
      - 'scraper/**'
      - 'data/data.js'
  schedule:
    # 09:30 gio VN (02:30 UTC) - sau dot quet 09:05 nen du lieu cua hom nay da co.
    - cron: '30 2 * * *'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: verify-system-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Phien ban cong cu
        shell: pwsh
        run: |
          node --version
          $PSVersionTable.PSVersion.ToString()
          foreach ($p in @(
            'C:\Program Files\Google\Chrome\Application\chrome.exe',
            'C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe')) {
            "$(if (Test-Path $p) { 'CO ' } else { 'KHONG' })  $p"
          }

      - name: Chay toan bo khang dinh (tests/verify-system.ps1)
        shell: powershell
        run: |
          powershell -ExecutionPolicy Bypass -File tests/verify-system.ps1
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::Suite khang dinh that bai - xem cac dong FAIL o tren."
            exit $LASTEXITCODE
          }
