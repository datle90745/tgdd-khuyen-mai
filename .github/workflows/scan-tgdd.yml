name: Quét PMH TGDĐ

on:
  schedule:
    # Quét tự động 6 lần/ngày vào các khung giờ chính (giờ Việt Nam, UTC+7):
    # 07:05 (00:05 UTC) - Mở đầu buổi sáng
    # 09:05 (02:05 UTC) - Khung giờ Flash Sale sáng
    # 12:05 (05:05 UTC) - Giữa trưa
    # 15:05 (08:05 UTC) - Khung giờ chiều
    # 18:05 (11:05 UTC) - Bắt đầu buổi tối
    # 21:05 (14:05 UTC) - Chốt đêm
    - cron: '5 0 * * *'
    - cron: '5 2 * * *'
    - cron: '5 5 * * *'
    - cron: '5 8 * * *'
    - cron: '5 11 * * *'
    - cron: '5 14 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: scan-tgdd
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: pip install -r scraper/requirements.txt
      # FPT Shop chặn kết nối từ máy chủ, cài đặt Playwright & Xvfb
      - run: python -m playwright install --with-deps chromium
      - run: sudo apt-get install -y --no-install-recommends xvfb
      - name: Quét 85 SKU
        id: focus
        continue-on-error: true
        env:
          CF_PROXY_URL: ${{ secrets.CF_PROXY_URL }}
          CF_PROXY_TOKEN: ${{ secrets.CF_PROXY_TOKEN }}
        run: python scraper/scan_tgdd.py
      - name: Quét toàn thị trường (TGDĐ, CellphoneS, FPT Shop, Viettel Store)
        id: market
        continue-on-error: true
        env:
          CF_PROXY_URL: ${{ secrets.CF_PROXY_URL }}
          CF_PROXY_TOKEN: ${{ secrets.CF_PROXY_TOKEN }}
          ERP_PORTAL_COOKIE: ${{ secrets.ERP_PORTAL_COOKIE }}
        run: xvfb-run -a python scraper/scan_market.py
      - name: Lưu kết quả
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for f in data/scans data/scans.js data/latest.js data/links.js data/promos.js data/market.js data/alerts.js data/rises.js data/fpt.js data/market_last.json scraper/products.csv; do
            if [ -e "$f" ]; then git add "$f"; fi
          done
          if git diff --cached --quiet; then
            echo "Không có thay đổi"
            exit 0
          fi
          git commit -m "Đợt quét PMH $(TZ=Asia/Ho_Chi_Minh date +%d-%m-%Y)"
          for i in 1 2 3 4 5; do
            if git push; then exit 0; fi
            git fetch origin main
            if ! git rebase -X theirs origin/main; then
              git checkout --theirs . || true
              git add -A
              GIT_EDITOR=true git rebase --continue || git rebase --abort
            fi
            sleep 10
          done
          echo "::error::Không đẩy được kết quả sau 3 lần thử."
          exit 1
      - name: Báo lỗi nếu cả hai bước quét đều lỗi
        if: steps.focus.outcome == 'failure' && steps.market.outcome == 'failure'
        run: exit 1
