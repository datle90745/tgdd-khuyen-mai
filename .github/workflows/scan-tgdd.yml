name: Quét PMH TGDĐ

on:
  schedule:
    # Quet 8 lan/ngay, cach nhau 3 tieng, theo gio Viet Nam (UTC+7).
    #
    # TRUOC DAY la '7,17,27,37,47,57 * * * *' - moi 10 phut, 144 luot/ngay. Ket qua do
    # duoc ngay 18-11-2026: trong 100 luot gan nhat chi co 9 luot do `schedule` kich, 91
    # luot con lai la nguoi goi tay. GitHub co quyen hoan hoac BO HAN su kien schedule khi
    # he thong ban, va cron day dac thi bi bo gan het - nen he thong trong nhu "khong tu
    # dong". Mot dot quet lai mat ~20-25 phut, nen cron 10 phut cung tu chong len nhau.
    #
    # Tam gio co dinh, thua thot thi GitHub ton trong on dinh hon han. Trang web canh bao
    # khi du lieu qua 3 gio, nen 3 tieng mot lan la vua khop.
    - cron: '5 17 * * *'   # 00:05 gio VN
    - cron: '5 20 * * *'   # 03:05
    - cron: '5 23 * * *'   # 06:05
    - cron: '5 2 * * *'    # 09:05
    - cron: '5 5 * * *'    # 12:05
    - cron: '5 8 * * *'    # 15:05
    - cron: '5 11 * * *'   # 18:05
    - cron: '5 14 * * *'   # 21:05
  workflow_dispatch:
    inputs:
      fpt_batch_id:
        description: 'Windows FPT production API batch ID (empty for manual scans)'
        required: false
        type: string
      fpt_snapshot_sha:
        description: 'Exact commit containing the FPT batch'
        required: false
        type: string

permissions:
  contents: write
  issues: write   # de mo/dong phieu bao khi dot quet hong

concurrency:
  group: scan-tgdd
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - uses: actions/checkout@v5
      - name: Bỏ lượt lịch khi đợt TGDĐ đã xác minh còn mới
        id: decide
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            node scraper/should_scan_scheduled.mjs
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
  scan:
    needs: guard
    if: needs.guard.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: pip install -r scraper/requirements.txt
      - name: Kiem tra hoi quy luot quet Flash Sale cuoi
        run: python -m unittest discover -s tests -p 'test_flash_verify.py'
      - name: Kiem tra quy tac lich quet
        run: node tests/test_schedule.mjs
      - name: Kiem tra bo hen gio Cloudflare
        run: node tests/test_watchdog.mjs
      - name: Kiem tra luu dot quet khi co commit chen ngang
        run: python -m unittest discover -s tests -p 'test_publish_scan.py'
      - name: Kiem tra bang chung gia tu danh muc TGDĐ
        run: node tests/test_dtdd_evidence.mjs
      - name: Kiem tra du lieu qua han va dong chua xac minh tren web
        run: node tests/test_freshness.js
      - name: Lấy hai snapshot Windows của đúng batch trước khi quét
        if: inputs.fpt_snapshot_sha != ''
        env:
          FPT_SNAPSHOT_SHA: ${{ inputs.fpt_snapshot_sha }}
        run: |
          [[ "$FPT_SNAPSHOT_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
          git fetch --no-tags --depth=1 origin "$FPT_SNAPSHOT_SHA"
          git show "$FPT_SNAPSHOT_SHA:data/fpt_live.json" > data/fpt_live.json
          git show "$FPT_SNAPSHOT_SHA:data/tgdd_variant_live.json" > data/tgdd_variant_live.json
          echo "Windows snapshot commit: $FPT_SNAPSHOT_SHA"
      - name: Quét Master List TGDĐ (số SKU theo tests/gate-config.json)
        id: focus
        continue-on-error: true
        env:
          CF_PROXY_URL: ${{ secrets.CF_PROXY_URL }}
          CF_PROXY_TOKEN: ${{ secrets.CF_PROXY_TOKEN }}
          TGDD_BATCH_ID: ${{ inputs.fpt_batch_id }}
        run: python scraper/scan_tgdd.py
      # Chromium is needed only by the market scanner on GitHub.
      - run: python -m playwright install --with-deps chromium
        continue-on-error: true
      - run: sudo apt-get install -y --no-install-recommends xvfb
        continue-on-error: true
      - name: Quét toàn thị trường (TGDĐ, CellphoneS, FPT Shop, Viettel Store)
        id: market
        continue-on-error: true
        env:
          CF_PROXY_URL: ${{ secrets.CF_PROXY_URL }}
          CF_PROXY_TOKEN: ${{ secrets.CF_PROXY_TOKEN }}
          ERP_PORTAL_COOKIE: ${{ secrets.ERP_PORTAL_COOKIE }}
          FPT_BATCH_ID: ${{ inputs.fpt_batch_id }}
        run: xvfb-run -a python scraper/scan_market.py
      # Trước đây bước báo lỗi nằm SAU bước commit, nên một bước quét hỏng thì hoàn toàn
      # im lặng, còn cả hai hỏng thì vẫn commit dữ liệu cũ rồi mới báo đỏ. Giờ chặn trước.
      - name: Chặn sớm nếu bước quét thất bại
        if: steps.focus.outcome == 'failure' || steps.market.outcome == 'failure'
        run: |
          echo "::error::Quét TGDĐ: ${{ steps.focus.outcome }} | Quét toàn thị trường: ${{ steps.market.outcome }}"
          if [ "${{ steps.focus.outcome }}" = "failure" ]; then
            echo "::error::Bước quét TGDĐ hỏng - không có đợt quét hôm nay, dừng trước khi commit."
            exit 1
          fi
          echo "::warning::Bước quét toàn thị trường hỏng; dữ liệu TGDĐ vẫn hợp lệ nên tiếp tục."
      - name: Đóng gói Offline HTML Bundles
        continue-on-error: true
        run: python scraper/bundle.py
      # Circuit breaker bắt buộc đợt quét phải là CỦA HÔM NAY, nên scan hỏng là chặn commit.
      - name: Kiểm định toàn vẹn dữ liệu (CI Circuit Breaker)
        run: node tests/verify_scan.js
      - name: Lưu kết quả
        run: python scraper/publish_scan.py

      # Trước đây một đợt quét hỏng là hoàn toàn im lặng: GitHub báo đỏ hàng chục lượt
      # liên tiếp mà không ai hay, và người dùng chỉ phát hiện khi tự mở bảng ra thấy dòng
      # "chưa có dữ liệu được xác minh". Hai lần hệ thống chết (10-11 và 17-11) đều được
      # phát hiện theo cách đó, sau hơn một ngày.
      # Nay hỏng là mở một phiếu trên repo — GitHub tự gửi email cho chủ repo. Phiếu được
      # dùng lại chứ không mở mới mỗi lượt, để 8 lượt hỏng trong ngày không thành 8 phiếu.
      - name: Báo động khi đợt quét hỏng
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          TIEU_DE="Đợt quét tự động đang hỏng"
          SO=$(gh issue list --state open --search "$TIEU_DE in:title" --json number --jq '.[0].number' || echo "")
          NOI_DUNG=$(printf 'Đợt quét lúc %s (giờ VN) thất bại.\n\nLượt chạy: %s\n\nDữ liệu trên web sẽ đứng yên cho tới khi việc này được sửa.\nPhiếu này tự đóng khi có một đợt quét chạy thành công trở lại.' "$(TZ=Asia/Ho_Chi_Minh date '+%d-%m-%Y %H:%M')" "$RUN_URL")
          if [ -n "$SO" ]; then
            gh issue comment "$SO" --body "$NOI_DUNG"
          else
            gh issue create --title "$TIEU_DE" --body "$NOI_DUNG"
          fi

      - name: Đóng phiếu báo động khi đã chạy lại được
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TIEU_DE="Đợt quét tự động đang hỏng"
          SO=$(gh issue list --state open --search "$TIEU_DE in:title" --json number --jq '.[0].number' || echo "")
          if [ -n "$SO" ]; then
            gh issue close "$SO" --comment "Đợt quét đã chạy lại bình thường lúc $(TZ=Asia/Ho_Chi_Minh date '+%d-%m-%Y %H:%M') giờ VN."
          fi
