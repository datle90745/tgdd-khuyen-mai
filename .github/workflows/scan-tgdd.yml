name: Quét PMH TGDĐ

on:
  schedule:
    # 07:30 giờ Việt Nam thứ Hai và thứ Sáu (00:30 UTC). GitHub có thể chạy trễ vài phút.
    # Ngoài lịch này chỉ quét khi bấm "Run workflow" trong tab Actions.
    - cron: '30 0 * * 1,5'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: scan-tgdd
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: pip install -r scraper/requirements.txt
      # FPT Shop chặn kết nối từ máy chủ, phải mở bằng trình duyệt thật
      - run: python -m playwright install --with-deps chromium
      - run: sudo apt-get install -y --no-install-recommends xvfb
      - name: Quét 85 SKU
        id: focus
        continue-on-error: true
        env:
          CF_PROXY_URL: ${{ secrets.CF_PROXY_URL }}
          CF_PROXY_TOKEN: ${{ secrets.CF_PROXY_TOKEN }}
        run: python scraper/scan_tgdd.py
      - name: Quét toàn thị trường (TGDĐ, CellphoneS, FPT Shop, Viettel Store)
        id: market
        continue-on-error: true
        env:
          CF_PROXY_URL: ${{ secrets.CF_PROXY_URL }}
          CF_PROXY_TOKEN: ${{ secrets.CF_PROXY_TOKEN }}
        run: xvfb-run -a python scraper/scan_market.py
      - name: Lưu kết quả
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for f in data/scans data/scans.js data/market.js; do
            if [ -e "$f" ]; then git add "$f"; fi
          done
          if git diff --cached --quiet; then
            echo "Không có thay đổi"
            exit 0
          fi
          git commit -m "Đợt quét PMH $(TZ=Asia/Ho_Chi_Minh date +%d-%m-%Y)"
          git push
      - name: Báo lỗi nếu cả hai bước quét đều lỗi
        if: steps.focus.outcome == 'failure' && steps.market.outcome == 'failure'
        run: exit 1
