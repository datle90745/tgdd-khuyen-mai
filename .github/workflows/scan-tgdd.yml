name: Quét PMH TGDĐ

on:
  schedule:
    # Recheck every 30 minutes; scan when verified TGDĐ result is >=90 minutes old.
    - cron: '5,35 * * * *'
  workflow_dispatch:
    inputs:
      fpt_batch_id:
        description: 'Windows FPT production API batch ID (empty for manual scans)'
        required: false
        type: string
      fpt_snapshot_sha:
        description: 'Exact commit containing the FPT batch'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: scan-tgdd
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - uses: actions/checkout@v5
      - name: Bỏ lượt lịch khi đợt TGDĐ đã xác minh còn mới
        id: decide
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            node scraper/should_scan_scheduled.mjs
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
  scan:
    needs: guard
    if: needs.guard.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: pip install -r scraper/requirements.txt
      - name: Kiem tra hoi quy luot quet Flash Sale cuoi
        run: python -m unittest discover -s tests -p 'test_flash_verify.py'
      - name: Kiem tra quy tac lich quet
        run: node tests/test_schedule.mjs
      - name: Kiem tra du lieu qua han va dong chua xac minh tren web
        run: node tests/test_freshness.js
      - name: Lấy hai snapshot Windows của đúng batch trước khi quét
        if: inputs.fpt_snapshot_sha != ''
        env:
          FPT_SNAPSHOT_SHA: ${{ inputs.fpt_snapshot_sha }}
        run: |
          [[ "$FPT_SNAPSHOT_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
          git fetch --no-tags --depth=1 origin "$FPT_SNAPSHOT_SHA"
          git show "$FPT_SNAPSHOT_SHA:data/fpt_live.json" > data/fpt_live.json
          git show "$FPT_SNAPSHOT_SHA:data/tgdd_variant_live.json" > data/tgdd_variant_live.json
          echo "Windows snapshot commit: $FPT_SNAPSHOT_SHA"
      - name: Quét Master List TGDĐ (số SKU theo tests/gate-config.json)
        id: focus
        continue-on-error: true
        env:
          CF_PROXY_URL: ${{ secrets.CF_PROXY_URL }}
          CF_PROXY_TOKEN: ${{ secrets.CF_PROXY_TOKEN }}
          TGDD_BATCH_ID: ${{ inputs.fpt_batch_id }}
        run: python scraper/scan_tgdd.py
      - name: Quét FPT production API qua Cloudflare khi không có batch Windows
        id: fpt_cloud
        if: github.event_name == 'schedule' || inputs.fpt_batch_id == ''
        continue-on-error: true
        env:
          CF_PROXY_URL: ${{ secrets.CF_PROXY_URL }}
          CF_PROXY_TOKEN: ${{ secrets.CF_PROXY_TOKEN }}
        run: node scraper/scan_fpt_cloud.mjs
      # Browser setup for market cannot block the independently verified TGDĐ scan.
      - run: python -m playwright install --with-deps chromium
        continue-on-error: true
      - run: sudo apt-get install -y --no-install-recommends xvfb
        continue-on-error: true
      - name: Quét toàn thị trường (TGDĐ, CellphoneS, FPT Shop, Viettel Store)
        id: market
        continue-on-error: true
        env:
          CF_PROXY_URL: ${{ secrets.CF_PROXY_URL }}
          CF_PROXY_TOKEN: ${{ secrets.CF_PROXY_TOKEN }}
          ERP_PORTAL_COOKIE: ${{ secrets.ERP_PORTAL_COOKIE }}
          FPT_BATCH_ID: ${{ inputs.fpt_batch_id || steps.fpt_cloud.outputs.batch_id }}
        run: xvfb-run -a python scraper/scan_market.py
      # Trước đây bước báo lỗi nằm SAU bước commit, nên một bước quét hỏng thì hoàn toàn
      # im lặng, còn cả hai hỏng thì vẫn commit dữ liệu cũ rồi mới báo đỏ. Giờ chặn trước.
      - name: Chặn sớm nếu bước quét thất bại
        if: steps.focus.outcome == 'failure' || steps.market.outcome == 'failure'
        run: |
          echo "::error::Quét TGDĐ: ${{ steps.focus.outcome }} | Quét toàn thị trường: ${{ steps.market.outcome }}"
          if [ "${{ steps.focus.outcome }}" = "failure" ]; then
            echo "::error::Bước quét TGDĐ hỏng - không có đợt quét hôm nay, dừng trước khi commit."
            exit 1
          fi
          echo "::warning::Bước quét toàn thị trường hỏng; dữ liệu TGDĐ vẫn hợp lệ nên tiếp tục."
      - name: Đóng gói Offline HTML Bundles
        continue-on-error: true
        run: python scraper/bundle.py
      # Circuit breaker bắt buộc đợt quét phải là CỦA HÔM NAY, nên scan hỏng là chặn commit.
      - name: Kiểm định toàn vẹn dữ liệu (CI Circuit Breaker)
        run: node tests/verify_scan.js
      - name: Lưu kết quả
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          TAG="sync_$(TZ=Asia/Ho_Chi_Minh date +%Y%m%d_%H%M)"
          sed -i -E "s/\\?v=[^\"]+/?v=$TAG/g" index.html || true
          for f in data/scans data/scans.js data/latest.js data/links.js data/promos.js data/market.js data/alerts.js data/rises.js data/fpt.js data/market_last.json scraper/products.csv index.html "promotion tgdd.html" "promotion tgdd standalone.html" "promotion tgdd"; do
            if [ -e "$f" ]; then git add "$f"; fi
          done
          if git diff --cached --quiet; then
            echo "Không có thay đổi"
            exit 0
          fi
          git commit -m "Đợt quét PMH $(TZ=Asia/Ho_Chi_Minh date +%d-%m-%Y)"
          for i in 1 2 3 4 5; do
            if git push; then exit 0; fi
            git fetch origin main
            if ! git rebase -X theirs origin/main; then
              git checkout --theirs . || true
              git add -A
              GIT_EDITOR=true git rebase --continue || git rebase --abort
            fi
            # Circuit breaker o tren chay TRUOC rebase, nen truoc day ket qua cua rebase
            # khong bao gio duoc kiem. Lop loi that su da xay ra ngay 09-11-2026:
            # scan_*.json in moi truong mot dong, nen `rebase -X theirs` tron theo DONG
            # giua hai phien ban cua cung mot dong du lieu - lay "status" cua ban nay va
            # "pmh" cua ban kia. Ket qua la dong tu mau thuan (status=chua_mo_ban nhung
            # pmh=0) duoc day thang len main ma khong qua bat ky check nao.
            if ! node tests/verify_scan.js; then
              echo "::error::Rebase voi origin/main tao ra du lieu khong hop le (xem log circuit breaker o tren). KHONG day len."
              exit 1
            fi
            sleep 10
          done
          echo "::error::Không đẩy được kết quả sau 5 lần thử."
          exit 1
