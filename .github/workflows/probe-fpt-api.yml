name: Probe FPT public catalog API

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Test public product endpoint from GitHub runner
        env:
          CF_PROXY_URL: ${{ secrets.CF_PROXY_URL }}
          CF_PROXY_TOKEN: ${{ secrets.CF_PROXY_TOKEN }}
        run: |
          python - <<'PY'
          import json, os, urllib.error, urllib.parse, urllib.request

          targets = [
              ("production", "https://papi.fptshop.com.vn/gw/v1/public/fulltext-search-service/category"),
              ("alternate", "https://ci-papi.fptshop.com.vn/gw/v1/public/fulltext-search-service/category"),
          ]
          body = json.dumps({
              "slug": "dien-thoai/samsung", "skipCount": 0, "maxResultCount": 50,
              "sortMethod": "noi-bat", "categoryType": "category"
          }).encode()
          headers = {
              "User-Agent": "Mozilla/5.0",
              "Content-Type": "application/json",
              "Origin": "https://fptshop.com.vn",
              "Referer": "https://fptshop.com.vn/dien-thoai/samsung",
          }
          attempts = []
          for source, target in targets:
              attempts.append((source + " direct", target, headers))
              if os.getenv("CF_PROXY_URL") and os.getenv("CF_PROXY_TOKEN"):
                  proxy_url = os.environ["CF_PROXY_URL"].rstrip("/") + "/fetch?url=" + urllib.parse.quote(target, safe="")
                  attempts.append((source + " proxy", proxy_url,
                                   {**headers, "X-Proxy-Token": os.environ["CF_PROXY_TOKEN"]}))
          for label, url, request_headers in attempts:
              try:
                  req = urllib.request.Request(url, data=body, headers=request_headers, method="POST")
                  with urllib.request.urlopen(req, timeout=25) as response:
                      obj = json.load(response)
                      items = obj.get("items") or []
                      priced = sum(isinstance(p.get("currentPrice"), int) and p["currentPrice"] > 0
                                   for p in items)
                      print(f"{label}: HTTP {response.status}, items={len(items)}, priced={priced}")
              except urllib.error.HTTPError as error:
                  print(f"{label}: HTTP {error.code}")
              except Exception as error:
                  print(f"{label}: {type(error).__name__}: {error}")
          PY
      - name: Install browser for same-origin API probe
        run: |
          pip install --quiet playwright
          python -m playwright install --with-deps chromium
          sudo apt-get install -y --no-install-recommends xvfb
      - name: Call production API from FPT browser session
        run: |
          xvfb-run -a python - <<'PY'
          import json
          from playwright.sync_api import sync_playwright

          url = "https://papi.fptshop.com.vn/gw/v1/public/fulltext-search-service/category"
          body = {
              "slug": "dien-thoai/samsung", "skipCount": 0, "maxResultCount": 50,
              "sortMethod": "noi-bat", "categoryType": "category"
          }
          with sync_playwright() as pw:
              browser = pw.chromium.launch(headless=False, args=[
                  "--disable-blink-features=AutomationControlled", "--no-sandbox"])
              context = browser.new_context(user_agent="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/138.0.0.0 Safari/537.36",
                                            locale="vi-VN", timezone_id="Asia/Ho_Chi_Minh")
              page = context.new_page()
              page.add_init_script("Object.defineProperty(navigator, 'webdriver', {get: () => undefined})")
              for attempt in range(2):
                  page.goto("https://fptshop.com.vn/dien-thoai/samsung",
                            wait_until="domcontentloaded", timeout=30000)
                  try:
                      page.wait_for_selector('a[href^="/dien-thoai/"] h3', timeout=15000)
                      break
                  except Exception:
                      pass
              print("page title:", page.title(), "cards:", page.locator('a[href^="/dien-thoai/"] h3').count())
              try:
                  result = page.evaluate("""async ({url, body}) => {
                    const res = await fetch(url, {method: 'POST', credentials: 'include',
                      headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body)});
                    const text = await res.text();
                    if (!res.ok) return {status: res.status, length: text.length};
                    const data = JSON.parse(text);
                    return {status: res.status, items: data.items?.length,
                      priced: data.items?.filter(x => x.currentPrice > 0).length};
                  }""", {"url": url, "body": body})
                  print("browser API:", result)
              except Exception as error:
                  print("browser API error:", type(error).__name__, str(error)[:250])
              browser.close()
          PY
  network_probe:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Probe production API on runner network
        shell: bash
        run: |
          python - <<'PY'
          import json, urllib.error, urllib.request
          url = "https://papi.fptshop.com.vn/gw/v1/public/fulltext-search-service/category"
          body = json.dumps({"slug": "dien-thoai/samsung", "skipCount": 0,
                             "maxResultCount": 50, "sortMethod": "noi-bat",
                             "categoryType": "category"}).encode()
          req = urllib.request.Request(url, data=body, headers={
              "User-Agent": "Mozilla/5.0", "Content-Type": "application/json",
              "Origin": "https://fptshop.com.vn",
              "Referer": "https://fptshop.com.vn/dien-thoai/samsung"
          }, method="POST")
          try:
              with urllib.request.urlopen(req, timeout=20) as response:
                  obj = json.load(response)
                  print(f"HTTP {response.status}, items={len(obj.get('items') or [])}")
          except urllib.error.HTTPError as error:
              print(f"HTTP {error.code}")
          except Exception as error:
              print(f"{type(error).__name__}: {error}")
          PY
  erp_probe:
    runs-on: ubuntu-latest
    steps:
      - name: Read crawler status and FPT data age
        env:
          ERP_PORTAL_COOKIE: ${{ secrets.ERP_PORTAL_COOKIE }}
        run: |
          python - <<'PY'
          import datetime, json, os, urllib.error, urllib.request
          cookie = os.getenv("ERP_PORTAL_COOKIE", "")
          print("cookie configured:", bool(cookie))
          headers = {"Accept": "application/json",
                     "Cookie": cookie if "auth" in cookie else "auth-token=" + cookie}
          for path in ("/api/status", "/api/deals?retailer=FPT%20Shop"):
              req = urllib.request.Request("https://promotion.erp-portal.vn" + path,
                                           headers=headers)
              try:
                  with urllib.request.urlopen(req, timeout=20) as response:
                      data = json.load(response)
                      if isinstance(data, dict):
                          print(path, "HTTP", response.status,
                                "keys", list(data.keys())[:15],
                                "status", str(data.get("status"))[:160])
                      elif isinstance(data, list):
                          stamps = [d.get("scraped_at") for d in data
                                    if isinstance(d, dict) and d.get("scraped_at")]
                          print(path, "HTTP", response.status, "rows", len(data),
                                "newest", max(stamps) if stamps else "none")
              except urllib.error.HTTPError as error:
                  print(path, "HTTP", error.code)
              except Exception as error:
                  print(path, type(error).__name__)
          PY
      - name: Trigger one fresh FPT crawl and inspect timestamps
        env:
          ERP_PORTAL_COOKIE: ${{ secrets.ERP_PORTAL_COOKIE }}
        run: |
          python - <<'PY'
          import datetime, json, os, time, urllib.error, urllib.request

          base = "https://promotion.erp-portal.vn"
          cookie = os.environ["ERP_PORTAL_COOKIE"]
          headers = {"Accept": "application/json",
                     "Cookie": cookie if "auth" in cookie else "auth-token=" + cookie}
          req = urllib.request.Request(base + "/api/crawl?retailer=FPT%20Shop",
                                       data=b"", headers=headers, method="POST")
          try:
              with urllib.request.urlopen(req, timeout=45) as response:
                  data = json.load(response)
                  print("trigger HTTP", response.status, "result", str(data)[:300])
          except urllib.error.HTTPError as error:
              print("trigger HTTP", error.code)
              raise
          started = datetime.datetime.now(datetime.timezone.utc)
          for attempt in range(30):
              time.sleep(10)
              with urllib.request.urlopen(urllib.request.Request(
                      base + "/api/status", headers=headers), timeout=20) as response:
                  status = json.load(response)
              state = status.get("status")
              print("poll", attempt + 1, "state", state,
                    "progress", status.get("progress"),
                    "step", str(status.get("current_step"))[:100])
              if state in ("completed", "failed", "error"):
                  break
              if state == "idle" and attempt >= 1:
                  break
          with urllib.request.urlopen(urllib.request.Request(
                  base + "/api/deals?retailer=FPT%20Shop", headers=headers),
                  timeout=20) as response:
              deals = json.load(response)
          stamps = [d.get("scraped_at") for d in deals
                    if isinstance(d, dict) and d.get("scraped_at")]
          phones = [d for d in deals if d.get("category") == "Điện thoại"]
          print("FPT rows", len(deals), "phones", len(phones),
                "newest", max(stamps) if stamps else "none",
                "triggered_utc", started.isoformat())
          PY
